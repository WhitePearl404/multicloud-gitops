---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: workloads
  labels:
    app: frontend
    app.kubernetes.io/part-of: microservices-app
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          # Replace with your built + pushed image before the first sync.
          image: ghcr.io/whitepearl404/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              # 8080, not 80: the pod runs as non-root (uid 101 below),
              # and non-root processes can't bind privileged ports (<1024)
              # on Linux. The Service still exposes port 80 externally --
              # it maps to this port by name, so nothing else changes.
              containerPort: 8080
          env:
            - name: BACKEND_API_URL
              value: "http://backend.workloads.svc.cluster.local:8080"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: frontend
