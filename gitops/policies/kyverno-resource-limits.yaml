apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
spec:
  validationFailureAction: enforce
  rules:
  - name: check-pod-resource-limits
    match:
      resources:
        kinds:
        - Pod
        - Deployment
        - StatefulSet
    validate:
      message: "All containers must set both requests and limits for cpu and memory."
      pattern:
        spec:
          containers:
          - resources:
              limits:
                cpu: "*"
                memory: "*"
              requests:
                cpu: "*"
                memory: "*"
