apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-workload-labels
spec:
  validationFailureAction: enforce
  rules:
    - name: require-app-and-part-of-labels
      match:
        resources:
          kinds:
            - Deployment
            - StatefulSet
      validate:
        message: Workloads must define app and app.kubernetes.io/part-of labels.
        pattern:
          metadata:
            labels:
              app: "?*"
              app.kubernetes.io/part-of: "?*"
