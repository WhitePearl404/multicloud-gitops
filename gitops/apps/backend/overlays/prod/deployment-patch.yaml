apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: workloads
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: backend
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 600m
              memory: 1024Mi
          env:
            - name: LOG_LEVEL
              value: warn
