apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dev-gcp-apps
  namespace: ${argocd_namespace}
  labels:
    app.kubernetes.io/part-of: platform
spec:
  generators:
  - list:
      elements:
      - appName: frontend
        appPath: gitops/apps/frontend
        valuesFile: values-dev.yaml
      - appName: backend
        appPath: gitops/apps/backend
        valuesFile: values-dev.yaml
      - appName: redis
        appPath: gitops/apps/redis
        valuesFile: values-dev.yaml
  template:
    metadata:
      name: '{{appName}}-dev-gcp'
      labels:
        app.kubernetes.io/part-of: platform
    spec:
      project: default
      source:
        repoURL: ${git_repo_url}
        targetRevision: ${git_target_revision}
        path: '{{appPath}}'
        helm:
          valueFiles:
            - '{{valuesFile}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: workloads
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
